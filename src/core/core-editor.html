<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code in the Dark</title>
</head>
<body>
<main class="bare-template" hidden>
  <h1>This is the Core Editor template</h1>
  <p>It has no Round in it. To compete, make a Round package with the prep page.</p>
</main>
<div class="background"></div>
<canvas class="canvas-overlay"></canvas>
<pre id="editor"></pre>
<div class="streak-container">
  <div class="current">Combo</div>
  <div class="counter">0</div>
  <div class="bar"></div>
  <div class="exclamations"></div>
</div>
<div class="power-mode-indicator">
  <h1>POWER MODE!</h1>
</div>
<button type="button" class="name-badge" hidden></button>
<dialog class="name-dialog">
  <form method="dialog">
    <p class="name-dialog-round"></p>
    <label>What's your name? <input name="name" autocomplete="off"></label>
    <button>OK</button>
  </form>
</dialog>
<div class="reference" hidden>
  <span>Reference</span>
  <img alt="Reference">
</div>
<div class="instructions" hidden>
  <section class="instructions-panel" aria-label="Instructions" tabindex="-1"></section>
</div>
<div class="button-bar" hidden>
  <button type="button" class="reveal-button">Reveal</button>
  <button type="button" class="instructions-button">Instructions</button>
</div>
<div class="storage-failing" role="img" title="Autosave isn't working — download a backup" aria-label="Autosave isn't working — download a backup" hidden>
  <svg viewBox="0 0 16 16" width="24" height="24" aria-hidden="true">
    <path d="M8 1 15 14H1Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M8 6v4M8 11.5v1" stroke="currentColor" stroke-width="1.5"/>
  </svg>
</div>
<dialog class="reveal-dialog">
  <form method="dialog">
    <label>This will show the result of your code. Doing this before the Round is over WILL DISQUALIFY
      YOU. Are you sure you want to proceed? Type "yes" to confirm.
      <input name="confirm" autocomplete="off"></label>
    <button>Reveal</button>
    <button type="button" class="reveal-dialog-cancel">Cancel</button>
  </form>
</dialog>
<script type="application/json" id="round"></script>
<script type="module" src="./main.ts"></script>
</body>
</html>
