<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — Stage and Host console</title>
<!--
  PROTOTYPE — throwaway. Wayfinder ticket: "What do the Stage display and Host console look like?" (#13)
  Three Host console variants x three Stage variants, switchable independently:
    ?host=A|B|C   (← / → cycle)            ?stage=A|B|C   (Shift+← / Shift+→ cycle)
    ?view=split|host|stage                 (split is the default; stage = full-window Stage)
  Host A — Control desk   (laptop: rail of Rounds, one Round at a time, stepper + Roster table)
  Host B — Remote         (phone: one big contextual button, Round picker, collapsible Roster)
  Host C — Rounds board   (laptop: every Round as a column of its Roster, transport bar on top)
  Stage A — Giant clock   (timer dominates; small join corner; ranking shown all at once)
  Stage B — Join sidebar  (permanent QR sidebar; ranking revealed last-to-first)
  Stage C — Name tiles    (Roster as tiles, draining time bar; results as columns in seat order)
  Stage D — Combined      (after feedback: C's tiles, A's giant clock while running, the Reference while voting)
  Real: the lifecycle rules from the session-model and voting decisions, tally/ties, stale-Revision flag,
        timer from an absolute endsAt (survives a Host or Stage disconnect), QR codes (inlined qrcode-generator, MIT).
  Fake: the Durable Object, WebSockets, laptops and phones — all in-memory, driven by the venue simulator.
  No persistence: a reload resets to the seeded mid-event state.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: #0e0e11; color: #e9e9ee; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .mono, code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  /* ---------- page layout (prototype chrome) ---------- */
  #app { height: 100vh; display: grid; }
  #app.split { grid-template-columns: minmax(0, 1fr) minmax(440px, 44%); }
  #app.host { grid-template-columns: minmax(0, 1fr) 360px; }
  #app.stage { grid-template-columns: 1fr; }
  .pane { overflow: auto; min-height: 0; }
  #hostpane { background: #16171b; position: relative; }
  #rightpane { background: #08080a; border-left: 1px solid #ffffff14; display: flex; flex-direction: column; gap: 12px; padding: 12px 12px 90px; }
  #app.stage #rightpane { padding: 0; border: 0; }
  .frame-label { font: 600 11px system-ui; letter-spacing: .08em; text-transform: uppercase; color: #8a8a96; display: flex; justify-content: space-between; }
  .stage-frame { position: relative; overflow: hidden; background: #000; width: 100%; aspect-ratio: 16 / 9; border-radius: 6px; outline: 1px solid #ffffff1c; }
  #app.stage .stage-frame { aspect-ratio: auto; height: 100vh; border-radius: 0; outline: 0; }
  .st-scale { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }

  #switcher { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 100; display: flex; align-items: center; gap: 6px;
    background: #d4ff00; color: #111; border-radius: 999px; padding: 5px; box-shadow: 0 6px 24px #000a; font: 600 13px system-ui; white-space: nowrap; }
  #switcher .seg { display: flex; align-items: center; background: #0000000d; border-radius: 999px; }
  #switcher button { background: transparent; border: 0; border-radius: 999px; padding: 5px 10px; }
  #switcher button:hover { background: #0000001a; }
  #switcher button.on { background: #111; color: #d4ff00; }
  #switcher .label { padding: 0 6px; min-width: 150px; text-align: center; }
  #statepanel { position: fixed; left: 12px; top: 12px; bottom: 70px; width: min(480px, 46vw); z-index: 99; background: #000e; color: #b5f5c8;
    border: 1px solid #d4ff0055; border-radius: 10px; padding: 12px; overflow: auto; font: 11px/1.4 ui-monospace, Menlo, monospace; white-space: pre-wrap; display: none; }
  #statepanel.open { display: block; }
  #statepanel h4 { color: #d4ff00; margin: 0 0 4px; font-size: 11px; }

  /* ---------- venue simulator (prototype only) ---------- */
  .sim { background: #1b1c12; border: 1px dashed #d4ff0066; border-radius: 10px; padding: 10px 12px; font-size: 13px; color: #e8ecd0; }
  .sim h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #d4ff00; }
  .sim .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 5px 0; border-top: 1px solid #ffffff0d; }
  .sim .row > b { width: 74px; color: #b9bf9a; font-weight: 600; font-size: 12px; }
  .sim button, .sim select { background: #2b2d1d; border: 1px solid #d4ff0033; border-radius: 6px; padding: 3px 8px; font-size: 12px; }
  .sim button:hover { border-color: #d4ff00aa; }
  .sim button.on { background: #d4ff00; color: #111; }
  .sim button:disabled { opacity: .35; cursor: not-allowed; }
  .sim .note { color: #9da084; font-size: 12px; }
  .sim .last { color: #9da084; font: 11px ui-monospace, Menlo, monospace; margin-top: 6px; }

  dialog { background: #23242b; color: #e9e9ee; border: 1px solid #ffffff22; border-radius: 12px; padding: 18px 20px; width: min(440px, 92vw); box-shadow: 0 20px 60px #000c; }
  dialog::backdrop { background: #0008; }
  dialog h3 { margin: 0 0 8px; font-size: 17px; }
  dialog p { margin: 0 0 16px; color: #b7b7c2; }
  dialog menu { display: flex; justify-content: flex-end; gap: 8px; padding: 0; margin: 0; }

  /* ---------- Host console: shared bits ---------- */
  :root { --bg: #16171b; --panel: #1f2026; --line: #ffffff14; --muted: #9a9aa5; --accent: #ff3e8a; --ok: #43d17a; --warn: #ffb547; --danger: #ff5a4f; }
  .host { min-height: 100%; position: relative; }
  .host .muted { color: var(--muted); } .host .warn { color: var(--warn); }
  .btn { border: 1px solid #ffffff26; background: #2a2b33; border-radius: 8px; padding: 7px 13px; font-weight: 600; }
  .btn:hover { border-color: #ffffff55; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { background: transparent; border-color: #ff5a4f88; color: #ff8a82; }
  .btn.ghost { background: transparent; }
  .btn.sm { padding: 3px 9px; font-size: 12px; }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .host.offline [data-act], .host.offline [data-change], .host.offline input { pointer-events: none; opacity: .35; }
  .offline-banner { position: sticky; top: 0; z-index: 5; background: #5a2a00; color: #ffd6a3; padding: 8px 14px; font-weight: 600; font-size: 13px; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .02em; background: #ffffff14; white-space: nowrap; vertical-align: middle; }
  .chip.ph-upcoming { background: #2c3d66; color: #b9cdff; } .chip.ph-running { background: #164d2e; color: #8ff0b4; }
  .chip.ph-timesup { background: #5c3a0c; color: #ffd08a; } .chip.ph-voting { background: #5a1840; color: #ffaad6; }
  .chip.ph-results { background: #4d4410; color: #ffe680; } .chip.ph-idle { background: #ffffff14; color: #ccc; }
  .chip.stale { background: #5c3a0c; color: #ffd08a; } .chip.hand { background: #2c3d66; color: #b9cdff; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); vertical-align: middle; }
  .dot.off { background: #666; } .dot.hand { background: transparent; border: 1.5px dashed #8aa0ff; }
  .clock { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; font-weight: 700; }
  .clock.last-min { color: #ffb547; } .clock.last-ten { color: #ff5a4f; }
  .bar { height: 8px; background: #ffffff10; border-radius: 4px; overflow: hidden; } .bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .lead .bar > i { background: #ffd23e; }
  .addrow { display: flex; gap: 6px; } .addrow input { flex: 1; min-width: 0; background: #111216; border: 1px solid #ffffff22; border-radius: 8px; padding: 6px 9px; }
  .x { background: none; border: 0; color: #8a8a96; padding: 2px 6px; border-radius: 6px; } .x:hover { color: #ff8a82; background: #ff5a4f1a; }
  .claim { max-width: 460px; margin: 60px auto; background: #1f2026; border: 1px solid #ffffff14; border-radius: 14px; padding: 22px; }
  .claim h2 { margin: 0 0 4px; } .claim dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 14px 0; font-size: 13px; }
  .claim dt { color: #9a9aa5; } .claim dd { margin: 0; }
  .claim input { width: 100%; background: #111216; border: 1px solid #ffffff22; border-radius: 8px; padding: 9px 11px; margin: 6px 0 12px; }
  .claim .err { color: #ff8a82; font-size: 13px; margin: -6px 0 10px; }

  /* Host A — Control desk */
  .hA-top { display: flex; align-items: center; gap: 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: #1a1b20; }
  .hA-top .brand { font-weight: 800; } .hA-top .sp { flex: 1; }
  .hA-body { display: grid; grid-template-columns: 230px 1fr; min-height: calc(100vh - 47px); }
  .hA-rail { border-right: 1px solid var(--line); padding: 10px; display: flex; flex-direction: column; gap: 4px; }
  .rail-h { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 4px 6px; }
  .rail-item { text-align: left; background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 7px 9px; display: grid; gap: 2px; }
  .rail-item:hover { background: #ffffff08; } .rail-item.on { background: #ff3e8a1c; border-color: #ff3e8a66; }
  .rail-item small { color: var(--muted); font-size: 12px; }
  .hA-main { padding: 18px 22px 100px; display: grid; gap: 16px; align-content: start; max-width: 900px; }
  .hA-head { display: flex; align-items: center; gap: 10px; } .hA-head h1 { margin: 0; font-size: 26px; }
  .stepper { display: flex; gap: 4px; } .stepper span { flex: 1; text-align: center; padding: 6px 4px; font-size: 12px; font-weight: 600; border-radius: 6px; background: #ffffff08; color: #6d6d78; }
  .stepper span.done { color: #b7b7c2; background: #ffffff10; } .stepper span.now { background: var(--accent); color: #fff; }
  .hA-ctl { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
  .hA-ctl .clock { font-size: 56px; line-height: 1; min-width: 190px; }
  .hA-ctl .btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .hA-ctl .hint { flex-basis: 100%; color: var(--muted); font-size: 13px; }
  .dur { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  .dur input { width: 64px; background: #111216; border: 1px solid #ffffff22; border-radius: 8px; padding: 6px 8px; text-align: right; }
  .hA-sec h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; display: flex; gap: 10px; align-items: baseline; }
  table.roster { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  table.roster td, table.roster th { padding: 8px 12px; border-top: 1px solid var(--line); text-align: left; vertical-align: middle; }
  table.roster th { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); border-top: 0; }
  table.roster tr.off td.nm { color: #777; } table.roster td.w { width: 34%; } table.roster td.n { width: 1%; text-align: right; font-weight: 700; }
  table.roster tr.lead td.nm { color: #ffd23e; font-weight: 700; }

  /* Host B — Remote (phone) */
  .phone { width: 390px; height: 820px; margin: 18px auto 90px; border: 12px solid #000; border-radius: 46px; overflow: auto; box-shadow: 0 0 0 2px #333, 0 20px 50px #000a; background: var(--bg); }
  #app.host .phone { height: auto; min-height: 820px; }
  .hB { display: flex; flex-direction: column; gap: 14px; padding: 14px 16px 24px; min-height: 100%; }
  .hB header { display: flex; align-items: center; gap: 8px; }
  .hB header select { flex: 1; background: #2a2b33; border: 1px solid #ffffff22; border-radius: 10px; padding: 9px 10px; font-weight: 700; font-size: 16px; }
  .hB-hero { text-align: center; padding: 16px 0 6px; } .hB-hero .clock { font-size: 84px; line-height: 1; margin: 8px 0 4px; }
  .hB-hero .rn { font-size: 13px; color: var(--muted); }
  .hB-hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: -6px; }
  .hB-primary { width: 100%; padding: 20px; border-radius: 16px; border: 0; background: var(--accent); color: #fff; font-size: 20px; font-weight: 800; }
  .hB-sec { display: flex; gap: 8px; } .hB-sec .btn { flex: 1; padding: 12px; font-size: 15px; }
  .hB-dur { display: flex; align-items: center; justify-content: center; gap: 14px; } .hB-dur .btn { width: 52px; height: 44px; font-size: 20px; }
  .hB-dur b { font-size: 18px; min-width: 70px; text-align: center; }
  .hB-tally { display: grid; gap: 8px; background: var(--panel); border-radius: 12px; padding: 12px; }
  .hB-tally .r { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; } .hB-tally .r .bar { grid-column: 1 / -1; }
  .hB-tally .lead b { color: #ffd23e; }
  .hB details { background: var(--panel); border-radius: 12px; padding: 10px 12px; }
  .hB summary { font-weight: 700; cursor: pointer; } .hB summary small { font-weight: 400; color: var(--muted); }
  .hB li { list-style: none; display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
  .hB ul { margin: 8px 0; padding: 0; } .hB li .nm { flex: 1; } .hB li.off .nm { color: #777; }
  .hB footer { margin-top: auto; text-align: center; color: var(--muted); font-size: 12px; }

  /* Host C — Rounds board */
  .hC-transport { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 12px 16px; background: #1d1e24; border-bottom: 1px solid var(--line); }
  .hC-transport .now { display: grid; gap: 2px; min-width: 150px; } .hC-transport .now small { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
  .hC-transport .now b { font-size: 18px; }
  .hC-transport .clock { font-size: 38px; line-height: 1; min-width: 140px; }
  .hC-transport .sp { flex: 1; } .hC-transport .meta { color: var(--muted); font-size: 12px; text-align: right; }
  .hC-tbar { height: 4px; background: #ffffff10; } .hC-tbar > i { display: block; height: 100%; background: var(--accent); transform-origin: 0 50%; }
  .hC-board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr); gap: 10px; padding: 14px 16px 100px; overflow-x: auto; align-items: start; }
  .col { min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: grid; gap: 8px; }
  .col.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; background: #251b22; }
  .col h3 { margin: 0; font-size: 16px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: space-between; align-items: center; } .col .cst { font-size: 12px; color: var(--muted); }
  .card { background: #ffffff08; border: 1px solid var(--line); border-radius: 8px; padding: 7px 8px; display: grid; grid-template-columns: auto 1fr auto auto; gap: 4px 8px; align-items: center; }
  .card.off .nm { color: #777; } .card .bar { grid-column: 1 / -1; } .card.lead { border-color: #ffd23e88; } .card.lead .nm { color: #ffd23e; font-weight: 700; }
  .card .n { font-weight: 800; }
  .col .empty { color: #6d6d78; font-size: 12px; text-align: center; padding: 10px 0; }

  /* ---------- Stage: shared (1920 x 1080 logical px) ---------- */
  .st { position: absolute; inset: 0; background: #07070a; color: #f2f2f2; font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; overflow: hidden; }
  .st .pink { color: #ff3e8a; } .st .cyan { color: #3ee6ff; } .st .gold { color: #ffd23e; }
  .st .kicker { font-size: 34px; letter-spacing: .3em; text-transform: uppercase; color: #3ee6ff; }
  .st .clock.last-min { color: #ffb547; } .st .clock.last-ten { color: #ff3e8a; animation: throb 1s infinite; }
  @keyframes throb { 50% { opacity: .55; } }
  .st .qr { display: block; border-radius: 10px; }
  .st-offline { position: absolute; right: 22px; top: 14px; font: 600 26px system-ui; color: #ffb547; display: flex; gap: 8px; align-items: center; opacity: .8; }
  .st-offline i { width: 12px; height: 12px; border-radius: 50%; background: #ffb547; animation: throb 1s infinite; }
  .st-wait { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; gap: 24px; }
  .st-wait .big { font-size: 110px; font-weight: 800; }
  .st-wait .sub { font-size: 40px; color: #8a8a96; font-family: system-ui; }
  .tiebadge { display: inline-block; background: #ffd23e; color: #111; font-weight: 800; padding: 4px 18px; border-radius: 10px; font-size: 32px; letter-spacing: .1em; }

  /* Stage A — Giant clock */
  .stA-top { position: absolute; left: 70px; right: 70px; top: 50px; display: flex; justify-content: space-between; font-size: 40px; color: #8a8a96; }
  .stA-top b { color: #f2f2f2; }
  .stA-center { position: absolute; left: 70px; right: 70px; top: 140px; bottom: 230px; display: grid; place-content: center; text-align: center; gap: 10px; }
  .stA-clock { font-size: 440px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
  .stA-huge { font-size: 170px; font-weight: 800; line-height: 1.05; }
  .stA-sub { font-size: 48px; color: #b7b7c2; font-family: system-ui; }
  .stA-dur { font-size: 120px; color: #555; font-weight: 700; }
  .stA-bottom { position: absolute; left: 70px; right: 70px; bottom: 50px; height: 170px; display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; }
  .stA-names { font-size: 44px; color: #d0d0d8; display: flex; flex-wrap: wrap; gap: 8px 34px; align-self: center; font-family: system-ui; font-weight: 600; }
  .stA-names span::before { content: "● "; color: #ff3e8a; font-size: 26px; vertical-align: middle; }
  .stA-join { display: flex; align-items: center; gap: 22px; font-size: 30px; color: #b7b7c2; text-align: right; }
  .stA-join b { display: block; font-size: 54px; color: #f2f2f2; letter-spacing: .12em; }
  .stA-vote { display: flex; align-items: center; gap: 90px; text-align: left; }
  .stA-vote .count { font-size: 300px; font-weight: 800; line-height: .9; }
  .stA-welcome { display: flex; align-items: center; gap: 100px; text-align: left; }
  .stA-rank { width: 1500px; display: grid; gap: 18px; text-align: left; }
  .stA-rank .r { display: grid; grid-template-columns: 90px 420px 1fr 120px; align-items: center; gap: 24px; font-size: 56px; font-family: system-ui; font-weight: 700; }
  .stA-rank .r .pos { color: #666; font-family: ui-monospace, Menlo, monospace; } .stA-rank .r .n { text-align: right; font-family: ui-monospace, Menlo, monospace; }
  .stA-rank .r .b { height: 46px; background: #ffffff10; border-radius: 8px; overflow: hidden; } .stA-rank .r .b i { display: block; height: 100%; background: #ff3e8a; border-radius: 8px; }
  .stA-rank .r.lead { color: #ffd23e; } .stA-rank .r.lead .b i { background: #ffd23e; } .stA-rank .r.lead .pos { color: #ffd23e; }

  /* Stage B — Join sidebar */
  .stB-main { position: absolute; left: 0; top: 0; bottom: 0; width: 1340px; padding: 70px 80px; display: flex; flex-direction: column; }
  .stB-side { position: absolute; right: 0; top: 0; bottom: 0; width: 580px; background: #111118; border-left: 4px solid #ff3e8a; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; text-align: center; padding: 40px; }
  .stB-side .t { font-size: 46px; font-weight: 800; font-family: system-ui; }
  .stB-side .u { font-size: 30px; color: #b7b7c2; } .stB-side .code { font-size: 86px; font-weight: 800; letter-spacing: .14em; color: #3ee6ff; }
  .stB-side .ph { font-size: 28px; color: #8a8a96; font-family: system-ui; }
  .stB-head { display: flex; justify-content: space-between; align-items: baseline; font-size: 40px; color: #8a8a96; }
  .stB-head b { color: #f2f2f2; font-size: 64px; }
  .stB-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 30px; }
  .stB-clock { font-size: 330px; font-weight: 800; line-height: 1; }
  .stB-big { font-size: 150px; font-weight: 800; line-height: 1.05; }
  .stB-sub { font-size: 46px; color: #b7b7c2; font-family: system-ui; }
  .stB-names { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 40px; font-size: 46px; font-family: system-ui; font-weight: 600; color: #d0d0d8; }
  .stB-rank { display: grid; gap: 14px; }
  .stB-rank .r { display: grid; grid-template-columns: 80px 1fr 120px; align-items: center; gap: 20px; font-size: 58px; font-family: system-ui; font-weight: 700;
    padding: 10px 26px; border-radius: 14px; background: #ffffff08; opacity: 0; transform: translateY(30px); animation: rise .6s ease-out forwards; }
  .stB-rank .r .pos { color: #666; font-family: ui-monospace, Menlo, monospace; } .stB-rank .r .n { text-align: right; font-family: ui-monospace, Menlo, monospace; }
  .stB-rank .r.lead { background: #ffd23e; color: #111; transform: scale(.8); animation: crown .8s cubic-bezier(.2, 1.6, .4, 1) forwards; }
  .stB-rank .r.lead .pos { color: #111; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  let x = Math.random() * sum, i = 0; while ((x -= w[i]) > 0) i++;

const SIMA = {
  speed(n) { speed = +n; log('sim', `clock ${n}x`); },
  ff() { if (S.phase === 'running') { S.endsAt = vnow + 15e3; log('sim', 'fast-forward to 0:15 left'); } },
  laptop() { connectLaptop(ui.simRound, freshName(), SIM.rev[ui.simRound]); },
  stale() { connectLaptop(ui.simRound, freshName(), Math.max(1, SIM.rev[ui.simRound] - 1)); },
  reexport() { SIM.rev[ui.simRound]++; log('sim', `Organizer re-exported ${nameOf(ui.simRound)} as Rev ${SIM.rev[ui.simRound]} (new laptops open it)`); },
  reopenNew() {
    const rid = ui.simRound, max = SIM.rev[rid], e = S.entries[rid].find(e => !e.manual && e.rev < max);
    if (!e) return log('sim', 'nobody on an older Revision');

  },
  drop() { const e = pick(S.entries[ui.simRound].filter(e => !e.manual && e.online) || []); if (e) { e.online = false; log('laptop', `${e.name} went offline`); } },
  back() { const e = S.entries[ui.simRound].find(e => !e.manual && !e.online); if (e) { e.online = true; log('laptop', `${e.name} reconnected (same seat)`); } },
  phones(d) { S.phones = Math.max(0, S.phones + +d); },

  },
  tie() {

  if (!X.claimed) return stageWaiting(X);
  const r = roundOf(X), t = tally(X);
  let center = '', bottomNames = true, smallJoin = true;
  switch (X.phase) {
    case 'idle':
      bottomNames = false; smallJoin = false;
      center = `<div class="stA-welcome">${qrSvg(joinUrl(X), 420)}<div><div class="kicker">Code in the Dark</div><div class="stA-huge">${esc(X.comp.name)}</div>
        <div class="stA-sub">Join on your phone: <b class="cyan">${X.comp.url}</b> · code <b class="cyan">${X.comp.joinCode}</b></div></div></div>`; break;
    case 'upcoming': center = `<div class="kicker">Up next</div><div class="stA-huge">${esc(r.name)}</div><div class="stA-dur clock" data-clock="stage"></div>`; break;
    case 'running': center = `<div class="stA-clock clock" data-clock="stage"></div>`; break;
    case 'timesup': center = `<div class="stA-huge pink">Time's up</div><div class="stA-sub">Hands off the keyboards. Reveals next.</div>`; break;
    case 'voting':
      smallJoin = false;
      center = `<div class="stA-vote">${qrSvg(joinUrl(X), 440)}<div><div class="kicker">Vote now · ${esc(r.name)}</div><div class="count">${t.total}</div><div class="stA-sub">vote${t.total === 1 ? '' : 's'} so far</div>
        <div class="stA-sub" style="margin-top:20px"><b class="cyan">${X.comp.url}</b> · <b class="cyan">${X.comp.joinCode}</b></div></div></div>`; break;
    case 'results':
      bottomNames = false;
      center = `<div class="stA-rank">${t.tie ? '<div><span class="tiebadge">TIE</span></div>' : ''}${t.rows.map(row => `<div class="r ${row.lead ? 'lead' : ''}"><span class="pos">${row.rank}.</span><span>${esc(row.e.name)}</span>
        <span class="b"><i style="width:${t.max ? row.n / t.max * 100 : 0}%"></i></span><span class="n">${row.n}</span></div>`).join('')}</div>`; break;
  }
  return `<div class="st stA">
    <div class="stA-top"><span>${r ? `<b>${esc(r.name)}</b> · ${PH[X.phase]}` : ''}</span><span>${esc(X.comp.name)}</span></div>
    <div class="stA-center">${center}</div>
    <div class="stA-bottom"><div class="stA-names">${bottomNames ? stageNames(X).map(e => `<span>${esc(e.name)}</span>`).join('') : ''}</div>
      ${smallJoin ? `<div class="stA-join"><div>React on your phone<b>${X.comp.joinCode}</b>${X.comp.url}</div>${qrSvg(joinUrl(X), 170)}</div>` : ''}</div>
    ${stageOffline()}</div>`;
}

// Stage B — Join sidebar
function stageB(X) {
  if (!X.claimed) return stageWaiting(X);
  const r = roundOf(X), t = tally(X);
  const side = `<aside class="stB-side"><div class="t">${X.phase === 'voting' ? 'Vote on your phone' : 'React on your phone'}</div>${qrSvg(joinUrl(X), 400)}
    <div class="u">${X.comp.url}</div><div class="code">${X.comp.joinCode}</div><div class="ph">${X.phones} phones in</div></aside>`;
  const names = `<div class="stB-names">${stageNames(X).map(e => `<span>${esc(e.name)}</span>`).join('')}</div>`;
  let body = '';
  switch (X.phase) {
    case 'idle': body = `<div class="kicker">Code in the Dark</div><div class="stB-big">${esc(X.comp.name)}</div><div class="stB-sub">Grab your phone and join →</div>`; break;
    case 'upcoming': body = `<div class="kicker">Up next</div><div class="stB-big">${esc(r.name)}</div><div class="stB-sub"><span class="clock" data-clock="stage"></span> on the clock</div>${names}`; break;
    case 'running': body = `<div class="stB-clock clock" data-clock="stage"></div>${names}`; break;
    case 'timesup': body = `<div class="stB-big pink">Time's up</div><div class="stB-sub">Reveals next.</div>${names}`; break;
    case 'voting': body = `<div class="kicker">Voting is open</div><div class="stB-big" style="font-size:300px">${t.total}</div><div class="stB-sub">vote${t.total === 1 ? '' : 's'}. Pick your favourite on your phone.</div>`; break;
    case 'results': {
      // last-to-first: lower ranks rise first, joint leaders arrive together, last
      const ranks = [...new Set(t.rows.map(x => x.rank))].sort((a, b) => b - a);
      body = `${t.tie ? '<div><span class="tiebadge">TIE</span></div>' : ''}<div class="stB-rank">${t.rows.map(row => {
        const d = ranks.indexOf(row.rank) * 1.1 + (row.lead ? .9 : 0);
        return `<div class="r ${row.lead ? 'lead' : ''}" style="animation-delay:${d}s"><span class="pos">${row.rank}.</span><span>${esc(row.e.name)}</span><span class="n">${row.n}</span></div>`; }).join('')}</div>`;
    }
  }
  return `<div class="st stB"><main class="stB-main"><div class="stB-head"><span>${r ? `<b>${esc(r.name)}</b>` : ''}</span><span>${esc(X.comp.name)}</span></div>
    <div class="stB-body">${body}</div></main>${side}${stageOffline()}</div>`;
}

// Stage C — Name tiles
function stageC(X) {
  if (!X.claimed) return stageWaiting(X);
  const r = roundOf(X), t = tally(X), es = stageNames(X), byId = new Map(t.rows.map(x => [x.e.id, x]));
  const foot = `<div class="stC-foot">${qrSvg(joinUrl(X), 140)}<span>${X.phase === 'voting' ? 'Vote' : 'React'} at ${X.comp.url} · <b>${X.comp.joinCode}</b></span></div>`;
  const tiles = mode => `<div class="stC-tiles">${es.map(e => {
    const v = byId.get(e.id);
    if (mode === 'results') return `<div class="tile ${v.lead ? 'lead' : ''}"><div class="fill" style="height:${t.max ? v.n / t.max * 100 : 0}%"></div><div class="n">${v.n}</div>${v.lead ? '<span class="crown">👑</span>' : ''}<div class="nm">${esc(e.name)}</div></div>`;
    return `<div class="tile ${mode === 'voting' ? 'q' : ''}"><div class="nm">${esc(e.name)}</div></div>`; }).join('')}</div>`;
  let mid = '';
  switch (X.phase) {
    case 'idle': return `<div class="st stC"><div class="stC-mid"><div class="kicker">Code in the Dark</div><div class="big">${esc(X.comp.name)}</div><div class="sub">Grab your phone. Join below.</div></div>${foot}${stageOffline()}</div>`;
    case 'upcoming': case 'running': case 'timesup': mid = tiles('plain'); break;
    case 'voting': mid = tiles('voting') + `<div class="stC-overlay"><div class="kicker">Vote now</div><div class="big">${t.total}</div><div class="sub">vote${t.total === 1 ? '' : 's'} so far</div></div>`; break;
    case 'results': mid = tiles('results'); break;
  }
  const kick = { upcoming: 'Up next', running: 'Coding in the dark', timesup: "Time's up · Reveals next", voting: 'Voting', results: t.tie ? 'Results · tie!' : 'Results' }[X.phase];
  return `<div class="st stC"><div class="stC-bar"><i data-bar="stage"></i></div>
    <div class="stC-head"><div class="rn"><small>${kick}</small>${esc(r.name)}</div><div class="clock" data-clock="stage"></div></div>
    ${mid}${foot}${stageOffline()}</div>`;
}

// ======================================================================
// Render
// ======================================================================
// Stage D — Combined (after the first round of feedback): tiles everywhere, the giant clock while running,
// and the Reference beside the turnout while voting, so the Audience compares the Reveals with the target.
const refCache = {};
function fakeReference(r) {  // stand-in for the Round's Reference screenshot
  if (refCache[r.id]) return refCache[r.id];
  const hue = [...r.id].reduce((a, c) => a + c.charCodeAt(0), 0) * 47 % 360, c1 = `hsl(${hue} 55% 22%)`, c2 = `hsl(${(hue + 40) % 360} 85% 62%)`;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
    <rect width="1440" height="900" fill="#f6f3ee"/><rect width="1440" height="90" fill="${c1}"/>
    <text x="70" y="58" font-family="Georgia" font-size="34" fill="#fff" font-weight="bold">Nordlys Coffee</text>
    ${['Menu', 'Visit', 'About'].map((t, i) => `<text x="${1060 + i * 120}" y="56" font-family="Helvetica" font-size="22" fill="#fff">${t}</text>`).join('')}
    <rect y="90" width="1440" height="420" fill="${c2}"/><text x="70" y="270" font-family="Georgia" font-size="78" fill="${c1}" font-weight="bold">Brewed in the dark.</text>
    <text x="72" y="330" font-family="Helvetica" font-size="28" fill="${c1}">Small-batch roasts from the far north, since 2011.</text>
    <rect x="72" y="380" width="230" height="64" rx="32" fill="${c1}"/><text x="118" y="422" font-family="Helvetica" font-size="24" fill="#fff" font-weight="bold">Order now</text>
    <circle cx="1120" cy="300" r="150" fill="${c1}" opacity=".9"/><circle cx="1120" cy="300" r="90" fill="#f6f3ee" opacity=".25"/>
    ${[0, 1, 2].map(i => `<rect x="${70 + i * 446}" y="570" width="406" height="260" rx="14" fill="#fff" stroke="#0001"/><rect x="${100 + i * 446}" y="600" width="80" height="80" rx="40" fill="${c2}"/>
      <text x="${100 + i * 446}" y="730" font-family="Georgia" font-size="30" fill="${c1}" font-weight="bold">${['Roast', 'Brew', 'Taste'][i]}</text>
      <rect x="${100 + i * 446}" y="755" width="300" height="12" rx="6" fill="#0002"/><rect x="${100 + i * 446}" y="780" width="220" height="12" rx="6" fill="#0002"/>`).join('')}
  </svg>`;
  return refCache[r.id] = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function stageD(X) {
  if (!X.claimed) return stageWaiting(X);
  if (X.phase === 'running') return stageA(X);
  if (X.phase !== 'voting') return stageC(X);
  const r = roundOf(X), t = tally(X);
  return `<div class="st stD"><div class="stD-vote">
    <div class="stD-ref"><div class="kicker">Reference · ${esc(r.name)}<span>which Reveal came closest?</span></div><img src="${fakeReference(r)}" alt=""></div>
    <aside class="stD-side"><div class="t">Vote now</div><div class="count">${t.total}</div><div class="sub">vote${t.total === 1 ? '' : 's'} so far</div>
      ${qrSvg(joinUrl(X), 300)}<div class="code">${X.comp.joinCode}</div><div class="sub" style="font-size:28px">${X.comp.url}</div></aside>
  </div>${stageOffline()}</div>`;
}

const HOSTR = { A: hostA, B: hostB, C: hostC }, STAGER = { A: stageA, B: stageB, C: stageC, D: stageD };
let stageWin = null;
function setHTML(el, html) {
  if (!el || el._html === html) return;
  const a = document.activeElement, id = a && el.contains(a) ? a.id : null, sel = id && a.selectionStart != null ? [a.selectionStart, a.selectionEnd] : null;
  el.innerHTML = html; el._html = html;
  if (id) { const n = document.getElementById(id); if (n) { n.focus(); if (sel) try { n.setSelectionRange(...sel); } catch (_) {} } }
}
function layout() {
  const app = document.getElementById('app');
  app.className = view;
  app.innerHTML = (view !== 'stage' ? '<div id="hostpane" class="pane"></div>' : '') +
    `<div id="rightpane" class="pane">${view === 'split' ? `<div class="frame-label"><span>Stage · venue monitor (1920×1080, scaled)</span><span id="stagelabel"></span></div>` : ''}
      ${view !== 'host' ? '<div class="stage-frame"><div class="st-scale"></div></div>' : ''}${view !== 'stage' ? '<div id="sim"></div>' : ''}</div>`;
  const f = document.querySelector('.stage-frame');
  if (f) new ResizeObserver(fitStage).observe(f);
}
function fitStage() {
  const f = document.querySelector('.stage-frame'); if (!f) return;
  const k = Math.min(f.clientWidth / 1920, f.clientHeight / 1080);
  f.firstElementChild.style.transform = `translate(${(f.clientWidth - 1920 * k) / 2}px, ${(f.clientHeight - 1080 * k) / 2}px) scale(${k})`;
}
function render() {
  if (view !== 'stage') {
    const X = SNAP.host, hp = document.getElementById('hostpane');
    const inner = !X.claimed ? hostClaim(X) : HOSTR[hostV](X);
    const banner = NET.host ? '' : '<div class="offline-banner">Connection lost — reconnecting… Controls are paused. The Round carries on on the server.</div>';
    setHTML(hp, `<div class="host ${NET.host ? '' : 'offline'}">${banner}${hostV === 'B' && X.claimed ? `<div class="phone">${inner}</div>` : inner}</div>`);
    renderSim();
  }
  if (view !== 'host') {
    setHTML(document.querySelector('.st-scale'), STAGER[stageV](SNAP.stage));
    const l = document.getElementById('stagelabel'); if (l) l.textContent = NET.stage ? '' : 'offline: frozen snapshot, clock keeps running';
  }
  renderSwitcher(); renderState(); updateClocks(); postToStage();
}
function updateClocks() {
  document.querySelectorAll('[data-clock]').forEach(el => {
    const X = SNAP[el.dataset.clock], p = X.phase, r = remaining(X);
    const txt = p === 'running' ? fmt(r) : p === 'upcoming' ? fmt(X.durationMs) : p === 'timesup' ? '00:00' : '';
    if (el.textContent !== txt) el.textContent = txt;
    el.classList.toggle('last-min', p === 'running' && r <= 60e3 && r > 10e3);
    el.classList.toggle('last-ten', p === 'running' && r <= 10e3);
  });
  document.querySelectorAll('[data-bar]').forEach(el => {
    const X = SNAP[el.dataset.bar];
    const f = X.phase === 'running' ? remaining(X) / X.totalMs : X.phase === 'upcoming' ? 1 : 0;
    el.style.transform = `scaleX(${f})`;
  });
}
function postToStage() { if (stageWin && !stageWin.closed) stageWin.postMessage({ citd: true, snap: SNAP.stage, online: NET.stage, vnow }, '*'); }

function renderSim() {
  const el = document.getElementById('sim'); if (!el) return;
  const voting = S.phase === 'voting', rn = nameOf(ui.simRound);
  setHTML(el, `<div class="sim"><h3>Venue simulator — prototype only</h3>
    <div class="row"><b>Clock</b>${[1, 10, 60].map(n => `<button class="${speed === n ? 'on' : ''}" data-act="sim.speed" data-arg="${n}">${n}×</button>`).join('')}
      <button data-act="sim.ff" ${S.phase === 'running' ? '' : 'disabled'}>⏩ to 0:15 left</button></div>
    <div class="row"><b>Laptops</b><select data-change="sim.round">${S.rounds.map(r => `<option value="${r.id}" ${ui.simRound === r.id ? 'selected' : ''}>${esc(r.name)} (exported Rev ${SIM.rev[r.id]})</option>`).join('')}</select>
      <button data-act="sim.laptop">+ opens file</button><button data-act="sim.stale">+ opens an old Rev</button>
      <button data-act="sim.drop">one drops</button><button data-act="sim.back">one returns</button></div>
    <div class="row"><b>Re-export</b><button data-act="sim.reexport">Organizer re-exports ${esc(rn)}</button><button data-act="sim.reopenNew">a stale laptop reopens the new file</button></div>
    <div class="row"><b>Phones</b><span class="note">${S.phones} connected</span><button data-act="sim.phones" data-arg="10">+10</button><button data-act="sim.phones" data-arg="-10">−10</button></div>
    <div class="row"><b>Votes</b><button data-act="sim.vote" data-arg="1" ${voting ? '' : 'disabled'}>+1</button><button data-act="sim.vote" data-arg="10" ${voting ? '' : 'disabled'}>+10</button>
      <button data-act="sim.change" ${voting ? '' : 'disabled'}>a phone changes pick</button><button data-act="sim.tie" ${voting ? '' : 'disabled'}>force a tie</button>
      ${voting ? '' : '<span class="note">only while voting is open</span>'}</div>
    <div class="row"><b>Network</b><button class="${NET.host ? '' : 'on'}" data-act="sim.net" data-arg="host">Host console ${NET.host ? 'online' : 'OFFLINE'}</button>
      <button class="${NET.stage ? '' : 'on'}" data-act="sim.net" data-arg="stage">Stage ${NET.stage ? 'online' : 'OFFLINE'}</button></div>
    <div class="row"><b>Reset</b><button data-act="sim.reset" data-arg="claimed">mid-event</button><button data-act="sim.reset" data-arg="fresh">fresh, unclaimed</button>
      ${view === 'split' ? '<button data-act="sim.popout">⧉ pop out Stage window</button>' : ''}</div>
    <div class="last">${esc(LOG.slice(0, 3).join('\n')).replace(/\n/g, '<br>')}</div></div>`);
}
function renderSwitcher() {
  const seg = (lbl, list, cur, act) => { const v = list.find(x => x.k === cur);
    return `<div class="seg"><button data-act="${act}" data-arg="-1">‹</button><span class="label">${lbl} ${v.k} — ${v.name}</span><button data-act="${act}" data-arg="1">›</button></div>`; };
  setHTML(document.getElementById('switcher'),
    (view !== 'stage' ? seg('Host', HOSTS, hostV, 'ui.host') : '') + (view !== 'host' ? seg('Stage', STAGES, stageV, 'ui.stage') : '') +
    (ui.remote ? '' : `<div class="seg">${['split', 'host', 'stage'].map(v => `<button class="${view === v ? 'on' : ''}" data-act="ui.view" data-arg="${v}">${v}</button>`).join('')}</div>
    <button data-act="ui.state">State</button>`));
}
function renderState() {
  const p = document.getElementById('statepanel'); if (!p.classList.contains('open')) return;
  const dump = { ...S, votes: Object.fromEntries(Object.entries(S.votes).map(([k, v]) => [nameOf(k), Object.keys(v).length + ' votes'])) };
  p.innerHTML = `<h4>Durable Object state</h4>${esc(JSON.stringify(dump, null, 1))}\n\n<h4>Event log</h4>${esc(LOG.join('\n'))}`;
}

// ======================================================================
// Wiring
// ======================================================================
function cycle(list, cur, d) { const i = list.findIndex(x => x.k === cur); return list[(i + d + list.length) % list.length].k; }
function syncUrl() {
  const p = new URLSearchParams(); p.set('host', hostV); p.set('stage', stageV); if (view !== 'split') p.set('view', view);
  history.replaceState(null, '', '?' + p);
}
const UIA = {
  host(d) { hostV = cycle(HOSTS, hostV, +d); syncUrl(); },
  stage(d) { stageV = cycle(STAGES, stageV, +d); syncUrl(); },
  view(v) { view = v; syncUrl(); layout(); fitStage(); },
  state() { document.getElementById('statepanel').classList.toggle('open'); },
};
async function run(act, arg) {
  const [ns, name] = act.includes('.') ? act.split('.') : ['host', act];
  if (ns === 'host') { if (!NET.host) return; await H[name](arg); }
  else if (ns === 'sim') { if (name === 'round') ui.simRound = arg; else SIMA[name](arg); }
  else if (ns === 'ui') UIA[name](arg);
  render();
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.tagName === 'SELECT') return;
  run(el.dataset.act, el.dataset.arg);
});
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el) run(el.dataset.change, el.value); });
document.addEventListener('input', e => {
  const el = e.target.closest('[data-model]'); if (!el) return;
  if (el.dataset.model === 'addName') ui.addName[el.dataset.arg] = el.value; else ui[el.dataset.model] = el.value;
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Enter' && t.dataset && t.dataset.model === 'addName') return run('addEntry', t.dataset.arg);
  if (e.key === 'Enter' && t.id === 'claimkey') return run('claim');
  if (t.closest && t.closest('input, textarea, select, [contenteditable]')) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    e.preventDefault(); const d = e.key === 'ArrowLeft' ? -1 : 1;
    if (e.shiftKey || view === 'stage') UIA.stage(d); else if (view !== 'stage') UIA.host(d);
    render();
  }
});
function ask(title, body, ok, danger) {
  const d = document.getElementById('dlg');
  d.querySelector('h3').textContent = title; d.querySelector('p').textContent = body;
  const b = d.querySelector('button[value=ok]'); b.textContent = ok; b.style.background = danger ? '#ff5a4f' : ''; b.style.borderColor = danger ? '#ff5a4f' : '';
  d.returnValue = ''; d.showModal();
  return new Promise(res => d.addEventListener('close', () => res(d.returnValue === 'ok'), { once: true }));
}
// A popped-out Stage window only renders what its opener sends it (the Stage is read-only anyway).
window.addEventListener('message', e => {
  if (!e.data || !e.data.citd || e.source !== window.opener) return;
  ui.remote = true; S = e.data.snap; SNAP = { host: S, stage: S }; NET.stage = e.data.online; vnow = e.data.vnow; render();
});

seed(true);
layout(); fitStage(); render();
setInterval(() => {
  const real = performance.now();
  if (!ui.remote) vnow += (real - lastReal) * speed;
  lastReal = real;
  if (!ui.remote && S.phase === 'running' && vnow >= S.endsAt) { S.phase = 'timesup'; S.endsAt = null; log('server', "time's up (Durable Object alarm)"); render(); }
  updateClocks();
  postToStage();
}, 100);
</script>
</body>
</html>
