<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE — Audience phone page</title>
<!--
  PROTOTYPE — throwaway. Wayfinder ticket: "What does the Audience phone page look like?" (#14)
  Three variants of the Audience phone page, switchable via ?variant=A|B|C (← / → cycle):
    A — Roster rows      (every Contestant is a row with its own emoji buttons; the ballot is the same rows)
    B — Pick, then pad   (Contestant chips on top, a huge emoji pad in the thumb zone; the ballot is its own screen)
    C — Swipe cards      (one Contestant per full-screen card, tap anywhere to send the chosen emoji; swipe to vote)
  Real: the phone's states (code entry, not open yet, welcome, up next, running, time's up, voting, results, offline),
        one vote per voter id with last-wins, turnout, ballot following the live Roster, tap coalescing + the request maths.
  Fake: the Durable Object, the sockets, the other phones and the Contestant laptops — in memory, driven by the simulator.
  No persistence: a reload resets to the seeded mid-event state.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; background: #0e0e11; color: #e9e9ee; overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

  /* ---------- prototype chrome ---------- */
  #app { height: 100vh; display: grid; grid-template-columns: 460px minmax(0, 1fr); }
  #phonepane { display: flex; align-items: center; justify-content: center; padding: 16px 16px 70px; background: #08080a; }
  .phone { width: 390px; height: min(844px, calc(100vh - 100px)); border-radius: 44px; border: 10px solid #222; background: #000; overflow: hidden; position: relative; box-shadow: 0 0 0 2px #333, 0 30px 80px #000; }
  #screen { position: absolute; inset: 0; overflow: hidden; }
  #fx { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  #simpane { overflow: auto; padding: 14px 16px 90px; display: flex; flex-direction: column; gap: 12px; background: #111214; }

  #switcher { position: fixed; left: 230px; bottom: 14px; transform: translateX(-50%); z-index: 100; display: flex; align-items: center; gap: 4px;
    background: #d4ff00; color: #111; border-radius: 999px; padding: 5px; box-shadow: 0 6px 24px #000a; font: 600 13px system-ui; white-space: nowrap; }
  #switcher button { background: transparent; border: 0; border-radius: 999px; padding: 5px 10px; }
  #switcher button:hover { background: #0000001a; }
  #switcher .label { padding: 0 6px; min-width: 170px; text-align: center; }

  .sim { background: #1b1c12; border: 1px dashed #d4ff0066; border-radius: 10px; padding: 10px 12px; font-size: 13px; color: #e8ecd0; }
  .sim h3 { margin: 0 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #d4ff00; display: flex; justify-content: space-between; }
  .sim .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 5px 0; border-top: 1px solid #ffffff0d; }
  .sim .row > b { width: 86px; color: #b9bf9a; font-weight: 600; font-size: 12px; }
  .sim button, .sim select, .sim input { background: #2b2d1d; border: 1px solid #d4ff0033; border-radius: 6px; padding: 3px 8px; font-size: 12px; }
  .sim button:hover { border-color: #d4ff00aa; }
  .sim button.on { background: #d4ff00; color: #111; }
  .sim button:disabled { opacity: .35; cursor: not-allowed; }
  .sim .note { color: #9da084; font-size: 12px; }
  .meters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 6px; }
  .meter { background: #00000040; border-radius: 8px; padding: 6px 8px; }
  .meter b { display: block; font: 700 20px ui-monospace, Menlo, monospace; color: #fff; }
  .meter span { font-size: 11px; color: #9da084; }
  .proj { margin-top: 8px; font-size: 12px; color: #c9cdb0; }
  .proj .bad { color: #ff6b5e; font-weight: 700; } .proj .good { color: #7ee08f; font-weight: 700; }
  #wire { margin-top: 6px; height: 74px; overflow: hidden; font: 11px/1.35 ui-monospace, Menlo, monospace; color: #9da084; background: #00000040; border-radius: 6px; padding: 4px 6px; }
  #statejson { font: 11px/1.35 ui-monospace, Menlo, monospace; color: #b5f5c8; white-space: pre-wrap; max-height: 240px; overflow: auto; margin: 6px 0 0; }

  /* Contestant laptops (stand-in only — how reactions look there is its own ticket) */
  .laptops { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 6px; }
  .laptop { position: relative; height: 96px; background: #141414; border: 1px solid #333; border-radius: 6px; overflow: hidden; font: 11px ui-monospace, Menlo, monospace; color: #4a4; padding: 4px 6px; }
  .laptop .who { color: #ddd; font-family: system-ui; font-weight: 600; }
  .laptop.off { opacity: .35; } .laptop.hand { border-style: dashed; color: #777; }
  .laptop .r { position: absolute; bottom: -4px; font-size: 18px; animation: rise 1.6s ease-out forwards; }
  @keyframes rise { to { transform: translateY(-80px); opacity: 0; } }

  /* ---------- the phone page (what's being judged) ---------- */
  .pg { position: absolute; inset: 0; display: flex; flex-direction: column; background: #0b0b10; color: #f2f2f7; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  .pg .muted { color: #8b8b99; }
  .hdr { padding: 46px 18px 10px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #ffffff12; }
  .hdr .rn { font-weight: 800; font-size: 18px; }
  .chip { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: #ffffff18; }
  .chip.running { background: #ff3e8a; color: #fff; } .chip.timesup { background: #ffb547; color: #111; } .chip.voting { background: #43d17a; color: #111; }
  .clock { margin-left: auto; font: 700 18px ui-monospace, Menlo, monospace; }
  .clock.amber { color: #ffb547; } .clock.pink { color: #ff3e8a; }
  .offbar { position: absolute; left: 50%; top: 40px; transform: translateX(-50%); z-index: 30; background: #3a2a10; color: #ffcf7a; border: 1px solid #ffb54766; padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; gap: 10px; }
  .big { font-size: 26px; font-weight: 800; line-height: 1.15; }
  .brand { font: 800 13px system-ui; letter-spacing: .25em; text-transform: uppercase; color: #ff3e8a; }
  .btnp { background: #ff3e8a; color: #fff; border: 0; border-radius: 14px; padding: 14px 22px; font-weight: 800; font-size: 17px; }
  .btnp:disabled { opacity: .35; }
  .btng { background: transparent; color: #c9c9d6; border: 1px solid #ffffff2a; border-radius: 12px; padding: 10px 16px; font-weight: 600; }
  .codein { display: flex; gap: 6px; }
  .codein input { width: 252px; text-align: center; font: 800 34px ui-monospace, Menlo, monospace; letter-spacing: .3em; text-transform: uppercase; background: #16161e; border: 2px solid #ffffff22; border-radius: 14px; padding: 10px 0 10px .3em; color: #fff; }
  .codein input:focus { outline: none; border-color: #ff3e8a; }
  .spin { width: 28px; height: 28px; border: 3px solid #ffffff22; border-top-color: #ff3e8a; border-radius: 50%; animation: sp 1s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .foot { padding: 10px 18px 28px; text-align: center; font-size: 13px; }
  .turnout { font-weight: 700; }
  .ebtn { border: 0; background: #1b1b24; border-radius: 12px; display: grid; place-items: center; transition: transform .05s; }
  .ebtn:active { transform: scale(.88); background: #2a2a38; }
  .ebtn:disabled { opacity: .25; }
  .tagline { font-size: 11px; font-weight: 600; color: #8b8b99; }
  .tick { color: #43d17a; font-weight: 800; }
  .burst { position: absolute; font-size: 30px; animation: burst .7s ease-out forwards; }
  @keyframes burst { from { transform: translate(-50%, -50%) scale(.6); opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% - 110px)) scale(1.4); opacity: 0; } }

  /* A — Roster rows */
  .a-list { flex: 1; overflow: auto; padding: 6px 12px 12px; display: flex; flex-direction: column; gap: 8px; }
  .a-row { background: #15151d; border-radius: 16px; padding: 10px 12px 12px; }
  .a-row.dim { opacity: .45; }
  .a-name { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; margin-bottom: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #43d17a; flex: none; }
  .dot.off { background: #666; }
  .a-emo { display: grid; gap: 6px; }
  .a-emo .ebtn { height: 46px; font-size: 26px; }
  .a-vote { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; background: #15151d; border: 2px solid transparent; border-radius: 16px; padding: 16px 14px; font-weight: 800; font-size: 19px; color: #fff; }
  .a-vote .radio { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #ffffff44; flex: none; display: grid; place-items: center; }
  .a-vote.mine { border-color: #43d17a; background: #12251a; }
  .a-vote.mine .radio { border-color: #43d17a; background: #43d17a; }
  .a-vote.mine .radio::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #0b0b10; }
  .a-vote .yv { margin-left: auto; font-size: 12px; color: #43d17a; }

  /* B — Pick, then pad */
  .b-chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 14px; scrollbar-width: none; }
  .b-chip { flex: none; border: 2px solid #ffffff1f; background: #15151d; color: #fff; border-radius: 999px; padding: 9px 16px; font-weight: 800; font-size: 15px; display: flex; gap: 6px; align-items: center; }
  .b-chip.sel { background: #fff; color: #0b0b10; border-color: #fff; }
  .b-chip.dim { opacity: .4; }
  .b-target { text-align: center; padding: 8px 16px 4px; }
  .b-target .to { font-size: 12px; color: #8b8b99; text-transform: uppercase; letter-spacing: .1em; }
  .b-target .nm { font-size: 34px; font-weight: 900; line-height: 1.1; }
  .b-pad { flex: 1; display: grid; gap: 10px; padding: 10px 14px 14px; align-content: end; }
  .b-pad .ebtn { font-size: 56px; min-height: 104px; border-radius: 22px; }
  .b-ballot { flex: 1; overflow: auto; padding: 8px 14px; display: flex; flex-direction: column; gap: 10px; }
  .b-ballot button { background: #15151d; border: 0; border-radius: 18px; padding: 20px; font-weight: 900; font-size: 22px; color: #fff; text-align: left; }
  .b-ballot button.dim { opacity: .55; }
  .b-ballot .note { font-size: 12px; font-weight: 600; color: #8b8b99; display: block; }

  /* C — Swipe cards */
  .c-wrap { flex: 1; position: relative; overflow: hidden; }
  .c-track { position: absolute; inset: 0; display: flex; transition: transform .25s ease; }
  .c-card { flex: none; width: 100%; height: 100%; padding: 14px; }
  .c-face { height: 100%; border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; position: relative; text-align: center; padding: 20px; }
  .c-face .nm { font-size: 46px; font-weight: 900; line-height: 1; text-shadow: 0 2px 20px #0006; }
  .c-face .hint { font-size: 13px; font-weight: 600; opacity: .75; }
  .c-face.dim { filter: grayscale(1) brightness(.5); }
  .c-dots { display: flex; justify-content: center; gap: 6px; padding: 2px 0 8px; }
  .c-dots i { width: 7px; height: 7px; border-radius: 50%; background: #ffffff33; }
  .c-dots i.on { background: #fff; }
  .c-tray { display: grid; gap: 6px; padding: 0 14px 26px; }
  .c-tray button { border: 2px solid transparent; background: #1b1b24; border-radius: 14px; font-size: 28px; height: 54px; }
  .c-tray button.sel { border-color: #fff; background: #2d2d3c; }
  .c-nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 2; width: 34px; height: 54px; border: 0; background: #00000055; color: #fff; font-size: 22px; border-radius: 10px; }
  .c-voteb { background: #fff; color: #0b0b10; border: 0; border-radius: 16px; padding: 14px 26px; font-weight: 900; font-size: 18px; margin-top: 10px; }
  .c-voteb.mine { background: #43d17a; }
</style>
</head>
<body>
<div id="app">
  <div id="phonepane"><div class="phone"><div id="screen"></div><div id="fx"></div></div></div>
  <div id="simpane"></div>
</div>
<div id="switcher"><button data-sw="-1">←</button><span class="label" id="swlabel"></span><button data-sw="1">→</button></div>

<script>
// =============================================================================================
// Fake Durable Object (server state) — everything a phone would get in its snapshot + updates
// =============================================================================================
const ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // no 0/O, 1/I/L
const S = {
  code: 'K7XQ2M',
  claimed: true,
  compName: 'Code in the Dark · Malmö',
  rounds: [
    { id: 'h1', name: 'Heat 1' }, { id: 'h2', name: 'Heat 2' }, { id: 'h3', name: 'Heat 3' },
    { id: 'h4', name: 'Heat 4' }, { id: 'f', name: 'Final' },
  ],
  current: 'h2',          // null = welcome screen
  phase: 'running',       // upcoming | running | timesup | voting | results
  duration: 15 * 60,
  endsAt: Date.now() + 9 * 60e3 + 12e3,
  rosters: {
    h1: mk(['Linnea', 'Omar', 'Sakura', 'Teodor', 'Beatriz']),
    h2: mk(['Ada', 'Mikael', 'Priya', 'Jonas', 'Fatima', 'Erik']),
    h3: mk(['Kalle', 'Noor', 'Ines', 'Viktor', 'Hanna']),
    h4: mk(['Sven', 'Amara', 'Lukas', 'Mei']),
    f: mk(['Linnea', 'Priya', 'Noor', 'Amara']),
  },
  votes: new Map(),       // voterId -> seat (current Round's run only)
};
S.rosters.h2[3].online = false;                                         // Jonas's laptop dropped
S.rosters.h2.push({ seat: 'h2-hand', name: 'Gustav', online: false, hand: true }); // hand-added by the Host
function mk(names) { return names.map((n, i) => ({ seat: n.toLowerCase() + '-' + i, name: n, online: true, hand: false })); }
const roster = () => (S.current ? S.rosters[S.current] : []);
const roundName = () => (S.rounds.find(r => r.id === S.current) || {}).name;
const reactable = e => e && e.online && !e.hand;

// =============================================================================================
// This phone
// =============================================================================================
const P = {
  joinedCode: 'K7XQ2M',   // null = on the code entry screen
  typed: '',
  online: true,
  voterId: 'v-' + Math.random().toString(36).slice(2, 8),
  sel: 0,                 // B + C: index of the selected Contestant
  emoji: 0,               // C: selected emoji
  bChanging: false,       // B: back on the list after voting
};
const SETS = {
  4: ['🔥', '👏', '😂', '😱'],
  6: ['🔥', '👏', '😂', '😱', '🤯', '❤️'],
  8: ['🔥', '👏', '😂', '😱', '🤯', '❤️', '💀', '🚀'],
};
const CFG = { set: 6, window: 1000 };   // coalescing window in ms; 0 = one message per tap
const emojis = () => SETS[CFG.set];

// =============================================================================================
// Variant switching
// =============================================================================================
const VARIANTS = { A: 'Roster rows', B: 'Pick, then pad', C: 'Swipe cards' };
let variant = new URLSearchParams(location.search).get('variant');
if (!VARIANTS[variant]) variant = 'A';
function setVariant(v) {
  variant = v; const u = new URL(location.href); u.searchParams.set('variant', v); history.replaceState(null, '', u);
  renderPhone(); renderSwitcher();
}
function cycle(d) { const k = Object.keys(VARIANTS); setVariant(k[(k.indexOf(variant) + d + k.length) % k.length]); }
document.getElementById('switcher').onclick = e => { const b = e.target.closest('[data-sw]'); if (b) cycle(+b.dataset.sw); };
addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select,[contenteditable]')) return;
  if (e.key === 'ArrowLeft') cycle(-1); if (e.key === 'ArrowRight') cycle(1);
});
function renderSwitcher() { document.getElementById('swlabel').textContent = variant + ' — ' + VARIANTS[variant]; }

// =============================================================================================
// Wire: taps -> (optionally coalesced) messages -> Contestant laptops
// =============================================================================================
const pending = new Map();   // "seat|emoji" -> count
const tapTimes = [], msgTimes = [], wireLog = [];
let totalMsgs = 0;
function tap(seat, e, x, y) {
  const entry = roster().find(r => r.seat === seat);
  if (!P.online || !reactable(entry) || view() !== 'react') return;   // reactions only before/while/after coding, never during voting
  burst(e, x, y);
  if (navigator.vibrate) navigator.vibrate(8);
  tapTimes.push(performance.now());
  const k = seat + '|' + e; pending.set(k, (pending.get(k) || 0) + 1);
  // leading edge: the first tap after a quiet spell goes out at once; taps inside the window ride the next message
  const since = performance.now() - lastSend;
  if (since >= CFG.window) flush(); else if (!flushTimer) flushTimer = setTimeout(flush, CFG.window - since);
}
let lastSend = -1e9, flushTimer = null;
function flush() {   // → messages are at least CFG.window apart, whatever the tap rate
  flushTimer = null;
  if (!pending.size) return;
  const bySeat = {};
  for (const [k, n] of pending) { const [seat, e] = k.split('|'); (bySeat[seat] ||= {})[e] = n; }
  pending.clear(); lastSend = performance.now();
  const seats = Object.keys(bySeat);   // one message carries every seat touched (usually one)
  send(seats.length === 1 ? seats[0] : '*', seats.length === 1 ? bySeat[seats[0]] : bySeat);
}
function send(seat, body) {
  if (!P.online) return;
  msgTimes.push(performance.now()); totalMsgs++;
  const msg = seat === '*' ? { t: 'react', multi: body } : { t: 'react', seat, e: body };
  wireLog.unshift(JSON.stringify(msg)); wireLog.length = Math.min(wireLog.length, 6);
  const tm = sim.querySelector('[data-m="total"]'); if (tm) tm.textContent = totalMsgs;
  const w = document.getElementById('wire'); if (w) w.innerHTML = wireLog.map(l => `<div>→ ${esc(l)}</div>`).join('');
  const deliveries = seat === '*' ? Object.entries(body) : [[seat, body]];
  for (const [s, em] of deliveries) for (const [e, n] of Object.entries(em)) deliver(s, e, n);
}
function deliver(seat, e, n) {
  const el = document.querySelector(`.laptop[data-seat="${seat}"]`);
  const entry = roster().find(r => r.seat === seat);
  if (!el || !reactable(entry)) return;   // offline laptops simply miss it — never queued
  const draw = Math.min(n, 12);           // stand-in cap; the real one is decided on the reactions ticket
  for (let i = 0; i < draw; i++) setTimeout(() => {
    const r = document.createElement('span'); r.className = 'r'; r.textContent = e;
    r.style.left = (8 + Math.random() * 80) + '%'; el.appendChild(r); setTimeout(() => r.remove(), 1700);
  }, (i * Math.max(CFG.window, 250)) / draw);   // spread a coalesced batch over its window
}
function burst(e, x, y) {
  const fx = document.getElementById('fx'), box = fx.getBoundingClientRect();
  const b = document.createElement('span'); b.className = 'burst'; b.textContent = e;
  b.style.left = (x - box.left) + 'px'; b.style.top = (y - box.top) + 'px'; b.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
  fx.appendChild(b); setTimeout(() => b.remove(), 750);
}
let mash = null;
function mashTest() {
  if (mash) return;
  const seats = roster().filter(reactable); if (!seats.length) return;
  let i = 0; const box = document.getElementById('screen').getBoundingClientRect();
  mash = setInterval(() => {
    tap(seats[P.sel % seats.length]?.seat || seats[0].seat, emojis()[i % emojis().length], box.left + box.width / 2, box.top + box.height * .7);
    if (++i >= 50) { clearInterval(mash); mash = null; }
  }, 100);
}

// =============================================================================================
// Phone rendering
// =============================================================================================
const screen = document.getElementById('screen');
function view() {
  if (!P.joinedCode) return 'entry';
  if (P.joinedCode !== S.code || !S.claimed) return 'notopen';
  if (!S.current) return 'welcome';
  if (S.phase === 'voting') return 'voting';
  if (S.phase === 'results') return 'results';
  return 'react';
}
function renderPhone() {
  const v = view();
  let html = '';
  if (v === 'entry') html = vEntry();
  else if (v === 'notopen') html = vNotOpen();
  else if (v === 'welcome') html = vWelcome();
  else if (v === 'results') html = vResults();
  else html = ({ A: { react: aReact, voting: aVote }, B: { react: bReact, voting: bVote }, C: { react: cReact, voting: cVote } })[variant][v]();
  screen.innerHTML = html + (P.online || v === 'entry' ? '' : '<div class="offbar">Reconnecting…</div>');
  if (v === 'entry') { const i = screen.querySelector('input'); i.value = P.typed; i.focus(); }
  tickClock();
  renderSim();
}
function header(withClock = true) {
  const chipTxt = { upcoming: 'up next', running: 'live', timesup: 'time’s up', voting: 'voting', results: 'results' }[S.phase];
  return `<div class="hdr"><span class="rn">${roundName()}</span><span class="chip ${S.phase}">${chipTxt}</span>
    ${withClock ? '<span class="clock" data-clock></span>' : ''}</div>`;
}
function tickClock() {
  const el = screen.querySelector('[data-clock]'); if (!el) return;
  let s = S.phase === 'running' ? Math.max(0, Math.ceil((S.endsAt - Date.now()) / 1000)) : S.phase === 'upcoming' ? S.duration : 0;
  if (S.phase !== 'running' && S.phase !== 'upcoming') { el.textContent = ''; return; }
  el.textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  el.className = 'clock' + (S.phase === 'running' && s <= 10 ? ' pink' : S.phase === 'running' && s <= 60 ? ' amber' : '');
}
const turnout = () => `<span class="turnout">${S.votes.size}</span> vote${S.votes.size === 1 ? '' : 's'} so far`;
const myVote = () => S.votes.get(P.voterId);
const subtitle = e => !e.online ? (e.hand ? 'no laptop — vote only' : 'offline') : '';
const phaseLine = () => ({ upcoming: 'Starting soon — warm them up', running: 'Cheer them on', timesup: 'Reveals coming — react to each one' })[S.phase];

function vEntry() {
  return `<div class="pg"><div class="center">
    <div class="brand">Code in the Dark</div>
    <div class="big">Enter the code<br>on the Stage</div>
    <div class="codein"><input maxlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" data-code placeholder="······"></div>
    <button class="btnp" data-join ${P.typed.length === 6 ? '' : 'disabled'}>Join</button>
    <div class="muted" style="font-size:12px">6 letters and digits · no account needed</div>
  </div></div>`;
}
function vNotOpen() {
  return `<div class="pg"><div class="center">
    <div class="spin"></div>
    <div class="big">Waiting for<br><span class="mono">${P.joinedCode}</span> to open</div>
    <div class="muted">Keep this page open — it starts by itself when the Host opens the Competition.</div>
    <div class="muted" style="font-size:12px">Not starting? Check the code on the Stage.</div>
    <button class="btng" data-leave>Change code</button>
  </div></div>`;
}
function vWelcome() {
  return `<div class="pg"><div class="center">
    <div class="brand">Code in the Dark</div>
    <div class="big">${S.compName}</div>
    <div class="tick" style="font-size:18px">✓ You’re in</div>
    <div class="muted">Nothing’s on yet. The next Round shows up here by itself.</div>
    <div class="muted" style="font-size:13px;margin-top:14px">While they code: send reactions to their screens.<br>After the Reveals: vote for the best one.</div>
  </div></div>`;
}
function vResults() {
  const mine = roster().find(r => r.seat === myVote());
  return `<div class="pg">${header(false)}<div class="center">
    <div style="font-size:54px">👀</div>
    <div class="big">Voting closed<br>Eyes on the Stage</div>
    <div class="muted">${mine ? `You picked <b style="color:#fff">${mine.name}</b>` : 'You didn’t vote this Round'}</div>
  </div></div>`;
}

// ---- A — Roster rows ----------------------------------------------------------------------
function aReact() {
  const cols = emojis().length <= 6 ? emojis().length : emojis().length / 2;
  return `<div class="pg">${header()}<div class="tagline" style="padding:8px 18px 2px">${phaseLine()}</div><div class="a-list">${roster().map(e => `
    <div class="a-row ${reactable(e) ? '' : 'dim'}">
      <div class="a-name"><span class="dot ${e.online ? '' : 'off'}"></span>${e.name}<span class="muted" style="font-size:12px;font-weight:600">${subtitle(e)}</span></div>
      ${e.hand ? '' : `<div class="a-emo" style="grid-template-columns:repeat(${cols},1fr)">${emojis().map(m => `<button class="ebtn" data-tap="${e.seat}" data-e="${m}" ${reactable(e) && P.online ? '' : 'disabled'}>${m}</button>`).join('')}</div>`}
    </div>`).join('')}</div></div>`;
}
function aVote() {
  return `<div class="pg">${header()}<div class="tagline" style="padding:10px 18px 2px">Whose Reveal came closest? Tap a name.</div><div class="a-list">${roster().map(e => `
    <button class="a-vote ${myVote() === e.seat ? 'mine' : ''}" data-vote="${e.seat}" ${P.online ? '' : 'disabled'}><span class="radio"></span>${e.name}${myVote() === e.seat ? '<span class="yv">your vote</span>' : ''}</button>`).join('')}</div>
    <div class="foot muted">${turnout()}${myVote() ? ' · tap another name to change' : ''}</div></div>`;
}

// ---- B — Pick, then pad -------------------------------------------------------------------
function bReact() {
  const r = roster(); P.sel = Math.min(P.sel, r.length - 1); const e = r[P.sel];
  const cols = 2;
  return `<div class="pg">${header()}
    <div class="b-chips">${r.map((x, i) => `<button class="b-chip ${i === P.sel ? 'sel' : ''} ${reactable(x) ? '' : 'dim'}" data-sel="${i}"><span class="dot ${x.online ? '' : 'off'}"></span>${x.name}</button>`).join('')}</div>
    <div class="b-target"><div class="to">${reactable(e) ? phaseLine() : '&nbsp;'}</div><div class="nm">${e.name}</div>
      <div class="muted" style="font-size:13px;min-height:18px">${reactable(e) ? '' : e.hand ? 'No laptop connected — you can still vote for them' : 'Laptop offline — reactions won’t reach them'}</div></div>
    <div class="b-pad" style="grid-template-columns:repeat(${cols},1fr)">${emojis().map(m => `<button class="ebtn" data-tap="${e.seat}" data-e="${m}" ${reactable(e) && P.online ? '' : 'disabled'} style="${emojis().length > 6 ? 'min-height:84px;font-size:46px' : ''}">${m}</button>`).join('')}</div>
  </div>`;
}
function bVote() {
  const mine = roster().find(r => r.seat === myVote());
  if (mine && !P.bChanging) return `<div class="pg">${header()}<div class="center">
      <div class="tick" style="font-size:64px">✓</div><div class="muted">You voted for</div><div class="big" style="font-size:38px">${mine.name}</div>
      <button class="btng" data-bchange ${P.online ? '' : 'disabled'} style="margin-top:14px">Change my vote</button></div>
    <div class="foot muted">${turnout()} · the Host closes voting</div></div>`;
  return `<div class="pg">${header()}<div class="tagline" style="padding:12px 18px 0;font-size:15px;color:#fff">Whose Reveal came closest?</div>
    <div class="b-ballot">${roster().map(e => `<button data-vote="${e.seat}" class="${myVote() && myVote() !== e.seat ? 'dim' : ''}" ${P.online ? '' : 'disabled'}>${e.name}${myVote() === e.seat ? ' <span class="tick">✓</span>' : ''}</button>`).join('')}</div>
    <div class="foot muted">${turnout()}</div></div>`;
}

// ---- C — Swipe cards ----------------------------------------------------------------------
const hue = seat => [...seat].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
function cDeck(face) {
  const r = roster(); P.sel = Math.min(P.sel, r.length - 1);
  return `<div class="c-wrap" data-swipe>
      <button class="c-nav" style="left:4px" data-cnav="-1">‹</button><button class="c-nav" style="right:4px" data-cnav="1">›</button>
      <div class="c-track" style="transform:translateX(${-P.sel * 100}%)">${r.map((e, i) => `<div class="c-card"><div class="c-face ${face === 'react' && !reactable(e) ? 'dim' : ''}" data-cface="${e.seat}" style="background:radial-gradient(circle at 30% 20%, hsl(${hue(e.seat)} 80% 55%), hsl(${(hue(e.seat) + 40) % 360} 70% 22%))">${face === 'react' ? cReactFace(e) : cVoteFace(e)}</div></div>`).join('')}</div>
    </div><div class="c-dots">${r.map((_, i) => `<i class="${i === P.sel ? 'on' : ''}"></i>`).join('')}</div>`;
}
function cReactFace(e) {
  return `<div class="nm">${e.name}</div><div class="hint">${reactable(e) ? `tap anywhere to send ${emojis()[P.emoji % emojis().length]}` : e.hand ? 'no laptop — vote only' : 'laptop offline'}</div>`;
}
function cVoteFace(e) {
  const mine = myVote() === e.seat;
  return `<div class="nm">${e.name}</div><button class="c-voteb ${mine ? 'mine' : ''}" data-vote="${e.seat}" ${P.online ? '' : 'disabled'}>${mine ? '✓ Your vote' : 'Vote for ' + e.name}</button>`;
}
function cReact() {
  return `<div class="pg">${header()}${cDeck('react')}
    <div class="c-tray" style="grid-template-columns:repeat(${emojis().length <= 6 ? emojis().length : 4},1fr)">${emojis().map((m, i) => `<button class="${i === P.emoji % emojis().length ? 'sel' : ''}" data-cemoji="${i}">${m}</button>`).join('')}</div></div>`;
}
function cVote() {
  return `<div class="pg">${header()}<div class="tagline" style="padding:10px 18px 0">Swipe through · whose Reveal came closest?</div>${cDeck('vote')}<div class="foot muted" style="padding-top:0">${turnout()}</div></div>`;
}

// ---- phone events ----
screen.addEventListener('pointerdown', ev => {
  const t = ev.target.closest('[data-tap]');
  if (t && !t.disabled) { tap(t.dataset.tap, t.dataset.e, ev.clientX, ev.clientY); return; }
  const f = ev.target.closest('[data-cface]');
  if (f && !ev.target.closest('button') && view() === 'react') { swipeStart = { x: ev.clientX, y: ev.clientY, seat: f.dataset.cface }; return; }
  if (ev.target.closest('[data-swipe]') && view() === 'voting') swipeStart = { x: ev.clientX, y: ev.clientY };
});
let swipeStart = null;
screen.addEventListener('pointerup', ev => {
  if (!swipeStart) return; const dx = ev.clientX - swipeStart.x; const s = swipeStart; swipeStart = null;
  if (Math.abs(dx) > 40) { cMove(dx < 0 ? 1 : -1); return; }
  if (s.seat) tap(s.seat, emojis()[P.emoji % emojis().length], ev.clientX, ev.clientY);
});
function cMove(d) { const n = roster().length; P.sel = Math.max(0, Math.min(n - 1, P.sel + d)); renderPhone(); }
screen.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.join !== undefined) return join(P.typed);
  if (b.dataset.leave !== undefined) { P.joinedCode = null; P.typed = ''; return renderPhone(); }
  if (b.dataset.sel !== undefined) { P.sel = +b.dataset.sel; return renderPhone(); }
  if (b.dataset.cnav !== undefined) return cMove(+b.dataset.cnav);
  if (b.dataset.cemoji !== undefined) { P.emoji = +b.dataset.cemoji; return renderPhone(); }
  if (b.dataset.bchange !== undefined) { P.bChanging = true; return renderPhone(); }
  if (b.dataset.vote !== undefined) { if (!P.online) return; S.votes.set(P.voterId, b.dataset.vote); P.bChanging = false; return renderPhone(); }
});
screen.addEventListener('input', ev => {
  if (!ev.target.matches('[data-code]')) return;
  P.typed = ev.target.value.toUpperCase().split('').filter(c => ALPHABET.includes(c)).join('').slice(0, 6);
  ev.target.value = P.typed;
  screen.querySelector('[data-join]').disabled = P.typed.length !== 6;
});
screen.addEventListener('keydown', ev => { if (ev.target.matches('[data-code]') && ev.key === 'Enter' && P.typed.length === 6) join(P.typed); });
function join(code) { P.joinedCode = code; renderPhone(); }

// =============================================================================================
// Simulator pane (prototype only)
// =============================================================================================
const sim = document.getElementById('simpane');
let showState = false;
function renderSim() {
  const r = roster();
  const ph = S.phase, cur = S.current;
  const reqPerPhoneSec = rate(msgTimes);
  sim.innerHTML = `
  <div class="sim"><h3>Host (fake Durable Object)</h3>
    <div class="row"><b>Competition</b>${S.claimed ? '<span class="note">claimed · Join code <span class="mono">' + S.code + '</span></span> <button data-s="unclaim">Unclaim (fresh start)</button>' : '<button data-s="claim">Host claims it</button><span class="note">phones with the code wait</span>'}</div>
    <div class="row"><b>Current</b><select data-s="current"><option value="">Welcome screen</option>${S.rounds.map(x => `<option value="${x.id}" ${x.id === cur ? 'selected' : ''}>${x.name}</option>`).join('')}</select>
      ${cur ? `<span class="note">phase: <b style="color:#fff">${ph}</b></span>` : ''}</div>
    ${cur ? `<div class="row"><b>Lifecycle</b>
      <button data-s="start" ${ph === 'upcoming' ? '' : 'disabled'}>Start</button>
      <button data-s="plus" ${ph === 'running' ? '' : 'disabled'}>+1 min</button>
      <button data-s="last10" ${ph === 'running' ? '' : 'disabled'}>Jump to last 15 s</button>
      <button data-s="end" ${ph === 'running' ? '' : 'disabled'}>End early</button>
      <button data-s="open" ${ph === 'timesup' ? '' : 'disabled'}>Open voting</button>
      <button data-s="close" ${ph === 'voting' ? '' : 'disabled'}>Close voting</button>
      <button data-s="reopen" ${ph === 'results' ? '' : 'disabled'}>Reopen voting</button>
      <button data-s="back" ${ph === 'timesup' || ph === 'results' ? '' : 'disabled'}>Back to up next</button></div>
    <div class="row"><b>Roster</b>${r.map(e => `<button data-s="toggle" data-seat="${e.seat}" class="${e.online ? 'on' : ''}" ${e.hand ? 'disabled title="hand-added: no laptop"' : ''}>${e.name}${e.hand ? ' ✋' : ''}</button><button data-s="remove" data-seat="${e.seat}" title="remove (discards its votes)">✕</button>`).join('')}</div>
    <div class="row"><b></b><input data-addname placeholder="Add by hand…" size="12"><button data-s="add">Add</button><span class="note">lit = laptop online</span></div>` : ''}
  </div>

  <div class="sim"><h3>This phone</h3>
    <div class="row"><b>Arrives by</b><button data-s="qr">Scanning the QR (code in the link)</button><button data-s="bare">Typing the URL (code entry)</button></div>
    <div class="row"><b>Network</b><button data-s="net" class="${P.online ? 'on' : ''}">${P.online ? 'Online' : 'Offline'}</button>
      <button data-s="clear">Clear storage → new voter id</button><span class="note mono">${P.voterId}${myVote() ? ' → ' + myVote() : ''}</span></div>
    <div class="row"><b>Crowd</b><button data-s="crowd" ${ph === 'voting' && cur ? '' : 'disabled'}>+8 other phones vote</button><span class="note">turnout ${S.votes.size}</span></div>
  </div>

  <div class="sim"><h3>Reactions on the wire <span class="note" style="text-transform:none;letter-spacing:0">mash the phone, or</span></h3>
    <div class="row"><b>Emoji set</b>${[4, 6, 8].map(n => `<button data-s="set" data-n="${n}" class="${CFG.set === n ? 'on' : ''}">${n}: ${SETS[n].join('')}</button>`).join('')}</div>
    <div class="row"><b>Coalesce</b>${[[0, 'Off — a message per tap'], [250, '250 ms (≤ 4 msg/s)'], [1000, '1 s (≤ 1 msg/s)']].map(([w, l]) => `<button data-s="coal" data-w="${w}" class="${CFG.window === w ? 'on' : ''}">${l}</button>`).join('')}</div>
    <div class="row"><b>Test</b><button data-s="mash" ${mash ? 'disabled' : ''}>Mash: 10 taps/s for 5 s</button><span class="note">first tap after a pause is sent at once; the rest ride the next message</span></div>
    <div class="meters">
      <div class="meter"><b data-m="taps">0</b><span>taps/s (this phone)</span></div>
      <div class="meter"><b data-m="msgs">0</b><span>messages/s sent</span></div>
      <div class="meter"><b data-m="total">${totalMsgs}</b><span>messages total</span></div>
    </div>
    <div class="proj" data-m="proj"></div>
    <div id="wire">${wireLog.map(l => `<div>→ ${esc(l)}</div>`).join('') || '<div>(nothing sent yet)</div>'}</div>
  </div>

  <div class="sim"><h3>Contestant laptops (stand-in — the look is the reactions ticket’s question)</h3>
    <div class="laptops">${r.map(e => `<div class="laptop ${e.online ? '' : 'off'} ${e.hand ? 'hand' : ''}" data-seat="${e.seat}"><div class="who">${e.name}</div>${e.hand ? 'no laptop' : e.online ? '&lt;div class="hero"&gt;…' : 'offline — drops reactions'}</div>`).join('') || '<span class="note">No Current Round.</span>'}</div>
  </div>

  <div class="sim"><h3>State <button data-s="state">${showState ? 'hide' : 'show'}</button></h3>${showState ? `<pre id="statejson">${esc(JSON.stringify({ server: { ...S, rosters: { [cur]: r }, votes: Object.fromEntries(S.votes) }, phone: { ...P, view: view(), variant } }, null, 1))}</pre>` : ''}</div>`;
  updateMeters();
}
const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
function rate(arr) { const now = performance.now(); while (arr.length && now - arr[0] > 1000) arr.shift(); return arr.length; }
function updateMeters() {
  const t = rate(tapTimes), m = rate(msgTimes);
  const q = s => sim.querySelector(`[data-m="${s}"]`);
  if (!q('taps')) return;
  q('taps').textContent = t; q('msgs').textContent = m;
  // research #4: incoming WS messages bill 20:1 as DO requests; Free = 100k/day; ~1,000 req/s soft limit per object
  const perSec = CFG.window ? 1000 / CFG.window : 5;
  const label = CFG.window ? `the cap of ${perSec} msg/s each` : `5 taps/s each (mashing, uncoalesced)`;
  const daily = Math.round(300 * perSec * 4500 / 20);
  const peak = 300 * perSec;
  q('proj').innerHTML = `Worst case — 300 phones at ${label} through 75 min of Rounds ≈ <span class="${daily > 100000 ? 'bad' : 'good'}">${daily.toLocaleString('en')} requests</span> (Free: 100,000/day) · peak <span class="${peak > 1000 ? 'bad' : 'good'}">${peak.toLocaleString('en')} msg/s</span> into one object (soft limit ~1,000/s).`;
}
setInterval(() => { updateMeters(); tickClock(); autoTimesUp(); }, 250);
function autoTimesUp() { if (S.current && S.phase === 'running' && Date.now() >= S.endsAt) { S.phase = 'timesup'; renderPhone(); } }

sim.addEventListener('change', ev => {
  if (ev.target.dataset.s === 'current') { S.current = ev.target.value || null; S.phase = 'upcoming'; P.sel = 0; P.bChanging = false; renderPhone(); }
});
sim.addEventListener('click', ev => {
  const b = ev.target.closest('[data-s]'); if (!b || b.tagName === 'SELECT') return;
  const r = roster(), seat = b.dataset.seat;
  switch (b.dataset.s) {
    case 'claim': S.claimed = true; break;
    case 'unclaim': S.claimed = false; S.current = null; S.votes.clear(); break;
    case 'start': S.votes.clear(); S.phase = 'running'; S.endsAt = Date.now() + S.duration * 1000; break;
    case 'plus': S.endsAt += 60e3; break;
    case 'last10': S.endsAt = Date.now() + 15e3; break;
    case 'end': S.phase = 'timesup'; break;
    case 'open': case 'reopen': S.phase = 'voting'; P.bChanging = false; break;
    case 'close': S.phase = 'results'; break;
    case 'back': S.phase = 'upcoming'; break;
    case 'toggle': { const e = r.find(x => x.seat === seat); e.online = !e.online; break; }
    case 'remove': { const i = r.findIndex(x => x.seat === seat); r.splice(i, 1); for (const [k, v] of S.votes) if (v === seat) S.votes.delete(k); break; }
    case 'add': { const i = sim.querySelector('[data-addname]'); if (i.value.trim()) r.push({ seat: 'hand-' + Date.now(), name: i.value.trim(), online: false, hand: true }); break; }
    case 'qr': P.joinedCode = S.code; break;
    case 'bare': P.joinedCode = null; P.typed = ''; break;
    case 'net': P.online = !P.online; if (!P.online) pending.clear(); break;
    case 'clear': P.voterId = 'v-' + Math.random().toString(36).slice(2, 8); P.bChanging = false; break;
    case 'crowd': for (let k = 0; k < 8; k++) { const pool = r; S.votes.set('crowd-' + Math.random().toString(36).slice(2, 7), pool[Math.floor(Math.random() ** 1.7 * pool.length)].seat); } break;
    case 'set': CFG.set = +b.dataset.n; P.emoji = 0; break;
    case 'coal': CFG.window = +b.dataset.w; break;
    case 'mash': mashTest(); break;
    case 'state': showState = !showState; break;
  }
  renderPhone();
});

renderSwitcher();
renderPhone();
</script>
</body>
</html>
